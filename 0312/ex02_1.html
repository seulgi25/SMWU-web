<!DOCTYPE html>
<html lang="ko"> <!--열리는 태그(html)-->
<head> <!--head태그-->
    <!-- 문서 정보-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 번째 HTML 문서</title>
</head>
<body>
    <!-- 본문 내용 -->
    <h1>안녕하세요, <em>HTML!</em></h1>
    <p>이것은 <strong>첫 번째</strong> HTML 문서입니다.</p>
</body>
</html>
