<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정슬기 - 사용자 등록</title>
     <style>
            body {
                background-color: rgb(216, 214, 214);
            }
            form {
                background-color: white;
            }
    </style>
</head>
<body>
    <header>
        <h1>사용자 등록 신청서</h1>
       
    </header>

    <main>
        <form>
        <fieldset>
            <legend><h3>기본 정보 (Essential)</h3></legend>
            <label for="username">아이디:</label><br/>
            <input type="text" id="username" name="username" placeholder="4~12자 영문/숫자"><br/><br/>
            <label for="password">비밀번호:</label><br/>
            <input type="password" id="password" name="password"><br/><br/>
            <input type="hidden" name="user_type" value="seulgi0821">
            <label for="email">이메일:</label><br/>
            <input type="email" id="email" name="email"><br/><br/>
        </fieldset>
        <br/>
        <fieldset>
            <legend><h3>추가 정보(Optional)</h3></legend>
            <label for="phone">연락처:</label><br/>
            <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" pattern="[0 - 9]{3}-[0-9]{4}-[0-9]{4}"><br/>
            <br/>
            <p>관심 분야:</p>
            <input type="checkbox" id="html" name="html">
            <label for="html">HMTL5</label>
            <input type="checkbox" id="css" name="css">
            <label for="css">CSS3</label>
            <input type="checkbox" id="js" name="js">
            <label for="js">JavaScript</label><br/><br/>
            <label for="experience">숙련도:</label><br/>
            <input type="range" id="experience" name="experience" min="0" max="10" step="1">
        </fieldset>
            <br/>
            <input type = "button" onclick="alert('가입신청이 완료되었습니다.')" value = "가입 신청">
            <input type = "reset" value = "초기화">
        </form>
    </main>
        
        

    <footer>
        <br/>
        <hr>
        <br/>
        <a href = "index.html">홈으로</a>
        <p>ⓒ 2026 Web Programming Course. All rights reserved.</p>
    </footer>
</body>
</html>
